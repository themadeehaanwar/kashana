<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kashana · add people</title>
<style>
:root{--bg:#faf7f2;--ink:#2b2a33;--mute:#8a8794;--line:#d4cec3;--panel:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#16151b;--ink:#ece9f2;--mute:#9a97a6;--line:#3a3844;--panel:#211f28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0}
p,.mute{color:var(--mute);font-size:13px;line-height:1.4}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:7px 12px;font:inherit;font-size:13px}
.tabs button.on{border-color:var(--ink);font-weight:600}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:12px 0 4px 4px}
select,input,textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:220px;border-radius:12px}
.go{margin-top:16px;width:100%;border:0;background:var(--ink);color:var(--bg);border-radius:22px;padding:12px;font:inherit;font-weight:600}
.sec{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 14px 14px;margin-top:14px}
.log div{font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px}.row>*{flex:1}
.ghost{margin-top:8px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:22px;padding:10px;font:inherit}
</style>
</head>
<body>
<h1>Kashana · private add page</h1>
<p>Nothing here changes the live site. It writes the new <b>family.txt</b> for you to paste into GitHub.</p>
<div class="tabs" id="tabs"></div>
<div id="form"></div>
<div class="sec">
  <label>Updated family.txt</label>
  <textarea id="out" readonly></textarea>
  <div class="row"><button class="ghost" id="copy">Copy all</button><button class="ghost" id="dl">Download file</button></div>
  <p>Then: GitHub → <b>family.txt</b> → pencil icon → select all → paste → <b>Commit changes</b>. The site updates in about a minute.</p>
  <div class="log" id="log"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let lines = [], mode = 'child';
const ind = l => l.match(/^[ \t]*/)[0].replace(/\t/g, '  ').length;
const isData = l => { const t = l.trim(); return t && t[0] !== '#'; };
const strip = l => l.trim().replace(/\s*\[[^\]]*\]/g, '').replace(/\s*\([mfMF]\)/g, '');
const headOf = l => l.split(/\s+\+\s+|\s+->/)[0];
const label = (l, i) => { const d = (ind(l) / 2); return '— '.repeat(d) + strip(l); };
const MODES = { child: 'Add a child', spouse: 'Add a spouse', gender: 'Set male / female', rename: 'Fix a name' };

function people(filter) {
  return lines.map((l, i) => ({ l, i })).filter(x => isData(x.l) && !x.l.includes('->') && (!filter || filter(x.l)));
}
function opts(list) { return list.map(x => `<option value="${x.i}">${label(x.l).replace(/</g, '&lt;')}</option>`).join(''); }
function render() {
  $('tabs').innerHTML = Object.entries(MODES).map(([k, v]) => `<button class="${k === mode ? 'on' : ''}" data-m="${k}">${v}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
  const g = '<label>Male / female</label><select id="g"><option value="">Not sure</option><option value="m">Male</option><option value="f">Female</option></select>';
  let h = '';
  if (mode === 'child') h = `<label>Whose child? (pick the parent)</label><select id="p">${opts(people())}</select>
    <label>Child’s name</label><input id="n" placeholder="e.g. Zara Anwar">${g}
    <label>Spouse’s name (optional)</label><input id="s" placeholder="optional">`;
  if (mode === 'spouse') h = `<label>Who is getting a spouse?</label><select id="p">${opts(people(l => !/\s\+\s/.test(l)))}</select>
    <label>Spouse’s name</label><input id="n" placeholder="e.g. Imran Khan">`;
  if (mode === 'gender') h = `<label>Person</label><select id="p">${opts(people())}</select>${g}`;
  if (mode === 'rename') h = `<label>Person</label><select id="p">${opts(people())}</select>
    <label>Correct name</label><input id="n" placeholder="new spelling">`;
  h += '<button class="go" id="go">Apply</button>';
  $('form').innerHTML = h;
  $('go').onclick = apply;
}
function note(t) { const d = document.createElement('div'); d.textContent = '✓ ' + t; $('log').prepend(d); }
function apply() {
  const i = +$('p').value, line = lines[i], n = ($('n') ? $('n').value : '').trim(), gv = $('g') ? $('g').value : '';
  const mark = gv ? ` (${gv})` : '';
  if (mode === 'child') {
    if (!n) return alert('Type the child’s name');
    let j = i + 1;
    while (j < lines.length && (!isData(lines[j]) || ind(lines[j]) > ind(line))) j++;
    while (j > i + 1 && !isData(lines[j - 1])) j--;
    const sp = ($('s').value || '').trim();
    lines.splice(j, 0, ' '.repeat(ind(line) + 2) + n + mark + (sp ? ' + ' + sp : ''));
    note(`Added ${n} under ${strip(line).split(' + ')[0]}`);
  } else if (mode === 'spouse') {
    if (!n) return alert('Type the spouse’s name');
    lines[i] = line.replace(/\s+$/, '') + ' + ' + n; note(`Added spouse ${n} to ${strip(line)}`);
  } else if (mode === 'gender') {
    const [head, ...rest] = line.split(/(\s+\+\s+|\s+->)/);
    lines[i] = head.replace(/\s*\([mfMF]\)/, '').replace(/\s+$/, '') + mark + rest.join(''); note(`Set ${strip(head)} to ${gv || 'not sure'}`);
  } else if (mode === 'rename') {
    if (!n) return alert('Type the correct name');
    const [head, ...rest] = line.split(/(\s+\+\s+|\s+->)/);
    const m = head.match(/\s*\([mfMF]\)/), id = head.match(/\s*\[[^\]]*\]/);
    lines[i] = ' '.repeat(ind(line)) + n + (m ? m[0] : '') + (id ? id[0] : '') + rest.join(''); note(`Renamed ${strip(head)} to ${n}`);
  }
  $('out').value = lines.join('\n'); render();
}
$('copy').onclick = async () => { try { await navigator.clipboard.writeText($('out').value); $('copy').textContent = 'Copied ✓'; setTimeout(() => $('copy').textContent = 'Copy all', 1800); } catch (e) { $('out').select(); } };
$('dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'text/plain' })); a.download = 'family.txt'; a.click(); };
fetch('family.txt', { cache: 'no-cache' }).then(r => r.text()).then(t => { lines = t.replace(/\r/g, '').split('\n'); $('out').value = lines.join('\n'); render(); })
  .catch(() => { $('form').textContent = 'Could not load family.txt. Run “npx serve” in the folder.'; });
</script>
</body>
</html>
